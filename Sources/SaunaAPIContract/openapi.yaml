components:
  responses:
    ServiceUnavailable:
      description: The service is temporarily unavailable; no internal details are returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableProblem'
          examples:
            unavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          description: A fixed liveness status; no dependency information is included.
    Version:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - version
      properties:
        apiVersion:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\s\S])
          description: The public API contract release; never a source revision.
        version:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\s\S])
          description: The public application release, without prerelease or build metadata.
    ServiceUnavailableProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      description: A restricted RFC 9457 problem with a fixed public message and no exception details.
      properties:
        type:
          type: string
          enum:
          - about:blank
        title:
          type: string
          enum:
          - Service Unavailable
        status:
          type: integer
          enum:
          - 503
    PasskeyOptionsResponse:
      type: object
      additionalProperties: false
      required:
      - challengeID
      - publicKey
      properties:
        challengeID:
          type: string
          format: uuid
        publicKey:
          type: object
          additionalProperties: true
    PasskeyFinishRequest:
      type: object
      additionalProperties: false
      required:
      - challengeID
      - credentialJSON
      properties:
        challengeID:
          type: string
          format: uuid
        credentialJSON:
          type: string
          maxLength: 65536
          description: JSON.stringify of the WebAuthn credential.toJSON() result. Original clientDataJSON bytes
            remain encoded within it.
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - userID
      - expiresAtUnixSeconds
      - csrfToken
      properties:
        userID:
          type: string
          format: uuid
        expiresAtUnixSeconds:
          type: integer
          format: int64
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
    AuthenticationProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          enum:
          - about:blank
        title:
          type: string
          enum:
          - Bad Request
          - Unauthorized
          - Forbidden
          - Payload Too Large
          - Too Many Requests
          - Service Unavailable
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 413
          - 429
          - 503
  securitySchemes:
    CustomerSession:
      type: apiKey
      in: cookie
      name: __Host-sauna-customer-session
    StaffSession:
      type: apiKey
      in: cookie
      name: __Host-sauna-staff-session
