openapi: 3.1.0
info:
  title: Sauna Studio API
  version: 1.0.0
  description: Public service status and release information. This contract does not expose hostnames, source revisions,
    deployment environments, or dependency status.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /
  description: The origin serving this API.
security: []
tags:
- name: Service
  description: Public service metadata without customer or operational details.
- name: Authentication
  description: Local Passkey registration, signed UV authentication and revocable sessions.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the API can answer requests
      description: A public liveness check, not database readiness or a diagnostic endpoint. A healthy API returns
        only the fixed public status. No authentication is required.
      tags:
      - Service
      security: []
      responses:
        '200':
          description: The API can answer requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                healthy:
                  value:
                    status: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /version:
    get:
      operationId: getVersion
      summary: Read public API and application release versions
      description: Returns semantic release versions only. Source revisions, build metadata, hostnames, runtime
        versions, and deployment environments are excluded. No authentication is required.
      tags:
      - Service
      security: []
      responses:
        '200':
          description: Public release version information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
              examples:
                release:
                  value:
                    apiVersion: 1.0.0
                    version: 0.1.0
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/passkeys/registration/options:
    post:
      operationId: beginPasskeyRegistration
      tags:
      - Authentication
      summary: beginPasskeyRegistration
      description: Local-only origin policy. Registration does not issue a session. Session issuance requires a
        valid signed assertion with user verification. The exact Origin selects the customer/staff host cookie.
        Flow cookies bind ceremonies.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          enum:
          - http://localhost:5173
          - http://localhost:5174
      - name: X-Sauna-CSRF
        in: header
        required: false
        schema:
          type: string
          maxLength: 43
      responses:
        '200':
          description: Successful local authentication operation.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure HttpOnly SameSite=Strict host-only flow/session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptionsResponse'
        '400':
          description: Fixed authentication error without internal details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblem'
        '401':
