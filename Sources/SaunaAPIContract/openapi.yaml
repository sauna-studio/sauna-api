      operationId: finishPasskeyRevocation
      tags:
      - Authentication
      summary: Revoke the bound passkey and all account sessions
      description: Local authenticated credential management. Every write requires the current session and CSRF.
        A fresh action-bound signed UV assertion authorizes addition or revocation. Successful changes revoke all
        account sessions and require login again. Only a different active credential may authorize revocation; the
        last active credential cannot be revoked.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          enum:
          - http://localhost:5173
          - http://localhost:5174
      - name: X-Sauna-CSRF
        in: header
        required: true
        schema:
          type: string
          maxLength: 43
      responses:
        '204':
          description: Successful local authentication operation.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure HttpOnly SameSite=Strict host-only flow/session cookie.
        '400':
          description: Fixed authentication error without internal details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblem'
        '401':
          description: Fixed authentication error without internal details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblem'
        '403':
          description: Fixed authentication error without internal details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblem'
        '413':
          description: Fixed authentication error without internal details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblem'
        '429':
          description: Fixed authentication error without internal details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblem'
        '503':
          description: Fixed authentication error without internal details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblem'
      security:
      - CustomerSession: []
      - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyFinishRequest'
