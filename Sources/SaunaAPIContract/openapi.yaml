components:
  responses:
    LocalFacilityBadRequest:
      description: Fixed local facility error without resource existence or authentication details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LocalFacilityProblem'}
    LocalFacilityUnauthorized:
      description: Fixed local facility error without resource existence or authentication details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LocalFacilityProblem'}
    LocalFacilityForbidden:
      description: Fixed local facility error without resource existence or authentication details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LocalFacilityProblem'}
    LocalFacilityNotFound:
      description: Fixed local facility error without resource existence or authentication details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LocalFacilityProblem'}
    LocalFacilityTooLarge:
      description: Fixed local facility error without resource existence or authentication details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LocalFacilityProblem'}
    LocalFacilityRateLimited:
      description: Fixed local facility error without resource existence or authentication details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LocalFacilityProblem'}
    LocalFacilityUnavailable:
      description: Fixed local facility error without resource existence or authentication details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LocalFacilityProblem'}
    ServiceUnavailable:
      description: The service is temporarily unavailable; no internal details are returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableProblem'
          examples:
            unavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
  schemas:
    ProductKind:
      type: string
      enum: [private_sauna, shared_sauna, day_tent, overnight_tent]
    ProductOffering:
      type: object
      additionalProperties: false
      required: [facilityID, id, name, kind, capacity, minimumDurationMinutes, maximumDurationMinutes, minimumNights, maximumNights, published]
      properties:
        facilityID: {type: string, format: uuid}
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {$ref: '#/components/schemas/ProductKind'}
        capacity: {type: integer, minimum: 1, maximum: 2147483647}
        minimumDurationMinutes: {type: integer, minimum: 1, maximum: 2147483647}
        maximumDurationMinutes: {type: integer, minimum: 1, maximum: 2147483647}
        minimumNights: {type: integer, minimum: 0, maximum: 2147483647}
        maximumNights: {type: integer, minimum: 0, maximum: 2147483647}
        published: {type: boolean}
    ProductOfferings:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ProductOffering'}
    ProductOfferingRequest:
      type: object
      additionalProperties: false
      required: [kind, capacity, minimumDurationMinutes, maximumDurationMinutes, minimumNights, maximumNights, published]
      properties:
        kind: {$ref: '#/components/schemas/ProductKind'}
        capacity: {type: integer, minimum: 1, maximum: 2147483647}
        minimumDurationMinutes: {type: integer, minimum: 1, maximum: 2147483647}
        maximumDurationMinutes: {type: integer, minimum: 1, maximum: 2147483647}
        minimumNights: {type: integer, minimum: 0, maximum: 2147483647}
        maximumNights: {type: integer, minimum: 0, maximum: 2147483647}
        published: {type: boolean}
    LocalFacilityProduct:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
    LocalFacilityProducts:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/LocalFacilityProduct'}
    LocalFacilityRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    LocalFacilityProblem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: {type: string, enum: ['about:blank']}
        title: {type: string, enum: ['Bad Request', Unauthorized, Forbidden, 'Not Found', 'Payload Too Large', 'Too Many Requests', 'Service Unavailable']}
        status: {type: integer, enum: [400, 401, 403, 404, 413, 429, 503]}
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          description: A fixed liveness status; no dependency information is included.
    Version:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - version
      properties:
        apiVersion:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\s\S])
          description: The public API contract release; never a source revision.
        version:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\s\S])
          description: The public application release, without prerelease or build metadata.
    ServiceUnavailableProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      description: A restricted RFC 9457 problem with a fixed public message and no exception details.
      properties:
        type:
          type: string
          enum:
          - about:blank
        title:
          type: string
          enum:
          - Service Unavailable
        status:
          type: integer
          enum:
          - 503
    PasskeyOptionsResponse:
      type: object
      additionalProperties: false
      required:
      - challengeID
      - publicKey
      properties:
        challengeID:
          type: string
          format: uuid
        publicKey:
          type: object
          additionalProperties: true
    PasskeyFinishRequest:
      type: object
      additionalProperties: false
      required:
      - challengeID
      - credentialJSON
      properties:
        challengeID:
          type: string
          format: uuid
        credentialJSON:
          type: string
          maxLength: 65536
          description: JSON.stringify of the WebAuthn credential.toJSON() result. Original clientDataJSON bytes
            remain encoded within it.
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - userID
      - expiresAtUnixSeconds
      - csrfToken
      properties:
        userID:
          type: string
          format: uuid
        expiresAtUnixSeconds:
          type: integer
          format: int64
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
    AuthenticationProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          enum:
          - about:blank
        title:
          type: string
          enum:
          - Bad Request
          - Unauthorized
          - Forbidden
          - Payload Too Large
          - Too Many Requests
          - Service Unavailable
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 413
          - 429
          - 503
    PasskeyRevocationRequest:
      type: object
      additionalProperties: false
      required:
      - credentialID
      properties:
        credentialID:
          type: string
          minLength: 2
          maxLength: 1364
          pattern: ^[A-Za-z0-9_-]+$
          description: Canonical base64url ID of an active credential belonging to this account.
    ManagedPasskey:
      type: object
      additionalProperties: false
      required:
      - credentialID
      - createdAtUnixSeconds
      - isCurrentSessionCredential
      properties:
        credentialID:
          type: string
          maxLength: 1364
        createdAtUnixSeconds:
          type: integer
          format: int64
        lastUsedAtUnixSeconds:
          type: integer
          format: int64
        isCurrentSessionCredential:
          type: boolean
    ManagedPasskeys:
      type: object
      additionalProperties: false
      required:
      - credentials
      properties:
        credentials:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ManagedPasskey'
  securitySchemes:
    CustomerSession:
      type: apiKey
      in: cookie
      name: __Host-sauna-customer-session
    StaffSession:
      type: apiKey
      in: cookie
      name: __Host-sauna-staff-session
