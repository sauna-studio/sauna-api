version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep CodeQL init and analyze on the same release.
      codeql:
        patterns:
          - "github/codeql-action/*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      # Update the generator, runtime, and HTTP adapter together.
      openapi:
        patterns:
          - "*swift-openapi-*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      # Pydantic pins its core exactly; validate the settings integration with it.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
