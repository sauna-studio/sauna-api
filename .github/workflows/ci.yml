name: Repository CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    uses: sauna-studio/.github/.github/workflows/reusable-repository.yml@84222ff551e9b6e9bab6ba4f29fe3ddb990b37cb
    permissions:
      contents: read
  openapi:
    name: OpenAPI schema and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate_openapi.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  swift:
    uses: sauna-studio/.github/.github/workflows/reusable-swift.yml@84222ff551e9b6e9bab6ba4f29fe3ddb990b37cb
    permissions:
      contents: read
