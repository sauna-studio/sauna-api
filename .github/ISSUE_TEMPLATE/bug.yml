name: バグ報告
description: 再現・期待動作・回帰テストを追跡する
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 再現方法と実際の動作
      description: 対象commit・環境・匿名化した手順を記載してください。脆弱性はSECURITY.mdへ。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作と影響
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件・回帰テスト
      value: "- [ ] 再現テストを追加し、修正後に成功する\n- [ ] 独立レビューと必要なセキュリティレビューを完了する"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 重複検索結果・依存関係
      description: 検索したIssue、関連PR・ADR、ブロッカーを完全URLで記載。依存がなければ「なし」。
    validations:
      required: true
